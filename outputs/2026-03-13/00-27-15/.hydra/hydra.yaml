hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data.train_files=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/phase3/sft_anomaly_train.parquet
    - data.val_files=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/phase3/sft_anomaly_val.parquet
    - data.prompt_key=prompt
    - data.response_key=response
    - data.max_length=1024
    - data.train_batch_size=2
    - data.micro_batch_size_per_gpu=1
    - model.partial_pretrain=Qwen/Qwen2.5-Coder-7B-Instruct
    - model.enable_gradient_checkpointing=true
    - trainer.project_name=cps_smoke
    - trainer.experiment_name=sft_smoke
    - trainer.total_epochs=1
    - trainer.total_training_steps=3
    - trainer.save_freq=-1
    - trainer.logger=["console"]
    - trainer.n_gpus_per_node=2
    - trainer.default_local_dir=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/smoke_test/sft_smoke
  job:
    name: fsdp_sft_trainer
    chdir: null
    override_dirname: data.max_length=1024,data.micro_batch_size_per_gpu=1,data.prompt_key=prompt,data.response_key=response,data.train_batch_size=2,data.train_files=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/phase3/sft_anomaly_train.parquet,data.val_files=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/phase3/sft_anomaly_val.parquet,model.enable_gradient_checkpointing=true,model.partial_pretrain=Qwen/Qwen2.5-Coder-7B-Instruct,trainer.default_local_dir=/home/simran/allspark-data-exploration/CPS-Debugger/outputs/smoke_test/sft_smoke,trainer.experiment_name=sft_smoke,trainer.logger=["console"],trainer.n_gpus_per_node=2,trainer.project_name=cps_smoke,trainer.save_freq=-1,trainer.total_epochs=1,trainer.total_training_steps=3
    id: ???
    num: ???
    config_name: sft_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/simran/allspark-data-exploration/CPS-Debugger
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/simran/.conda/envs/grpo/lib/python3.10/site-packages/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/simran/allspark-data-exploration/CPS-Debugger/outputs/2026-03-13/00-27-15
    choices:
      optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
